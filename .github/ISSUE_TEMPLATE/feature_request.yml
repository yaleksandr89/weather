name: Feature request / Предложить улучшение
description: Suggest an improvement for the Weather package / Предложить улучшение пакета Weather
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Describe the user problem first; a proposal does not guarantee acceptance. / Спасибо за предложение. Сначала опишите задачу пользователя; предложение не гарантирует принятие.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / Проблема
      description: What problem are you trying to solve, and who encounters it? / Какую проблему вы хотите решить и кто с ней сталкивается?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / Предлагаемое решение
      description: Describe the behavior or outcome you would like. / Опишите желаемое поведение или результат.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Affected scope / Затронутая область
      description: If known, identify Open-Meteo, WeatherAPI, a custom provider, or provider-independent behavior. / Если известно, укажите Open-Meteo, WeatherAPI, собственный провайдер или независимое от провайдера поведение.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / Альтернативы
      description: Describe any workarounds or alternatives you considered. / Опишите рассмотренные обходные пути или альтернативы.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation / Подтверждение
      options:
        - label: I searched existing Issues for the same request. / Я проверил(а) существующие Issues на наличие такого запроса.
          required: true
